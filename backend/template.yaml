# This is the SAM template that represents the architecture of your serverless application
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-template-basics.html

# The AWSTemplateFormatVersion identifies the capabilities of the template
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/format-version-structure.html
AWSTemplateFormatVersion: 2010-09-09
Description: >-
  its-on

# Transform section specifies one or more macros that AWS CloudFormation uses to process your template
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/transform-section-structure.html
Transform:
  - AWS::Serverless-2016-10-31

Parameters:
  PipelineRole:
    Type: String
  Env:
    Type: String
    Default: local
    Description: Environment name - used to populate stack names and subdomains

Conditions:
  IsProdEnv: !Equals [!Ref Env, prod]

# Resources declares the AWS resources that you want to include in the stack
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/resources-section-structure.html
Resources:
  ItsOnApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Env
      Cors: "'*'"
      Auth:
        DefaultAuthorizer: ItsOnCognitoAuthorizer
        Authorizers:
          ItsOnCognitoAuthorizer:
            UserPoolArn: !GetAtt ItsOnCognitoUserPool.Arn
      Domain:
        CertificateArn: arn:aws:acm:us-east-1:303579314896:certificate/89fd3c8f-9ccb-479e-b61a-36987061371e
        DomainName:
          "Fn::If":
            - IsProdEnv
            - api.itson.fyi
            - !Sub ${Env}.api.itson.fyi
        Route53:
          EvaluateTargetHealth: true
          HostedZoneId: Z06575223EAH4XQ5M1AVF

  # Each Lambda function is defined by properties:
  # https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction

  # This is a Lambda function config associated with the source code: get-all-items.js
  getAllItemsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/get-all-items.getAllItemsHandler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: A simple example includes a HTTP get method to get all items from a DynamoDB table.
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable
      Environment:
        Variables:
          # Make table name accessible as environment variable from function code during execution
          ITS_ON_TABLE: !Ref ItsOnTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /
            Method: GET
  # Each Lambda function is defined by properties:
  # https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction

  # This is a Lambda function config associated with the source code: get-by-id.js
  getByIdFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/get-by-id.getByIdHandler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: A simple example includes a HTTP get method to get one item by id from a DynamoDB table.
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable
      Environment:
        Variables:
          # Make table name accessible as environment variable from function code during execution
          ITS_ON_TABLE: !Ref ItsOnTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /{id}
            Method: GET
  # Each Lambda function is defined by properties:
  # https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction

  # This is a Lambda function config associated with the source code: put-item.js
  putItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/put-item.putItemHandler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: A simple example includes a HTTP post method to add one item to a DynamoDB table.
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable
      Environment:
        Variables:
          # Make table name accessible as environment variable from function code during execution
          ITS_ON_TABLE: !Ref ItsOnTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /
            Method: POST
  # Simple syntax to create a DynamoDB table with a single attribute primary key, more in
  # https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlesssimpletable

  # DynamoDB table to store item: {id: &lt;ID&gt;, name: &lt;NAME&gt;}
  ItsOnTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      PrimaryKey:
        Name: id
        Type: String
      ProvisionedThroughput:
        ReadCapacityUnits: 2
        WriteCapacityUnits: 2

  ItsOnCognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: ItsOnUsers
      Policies:
        PasswordPolicy:
          MinimumLength: 8
      UsernameAttributes:
        - email
      Schema:
        - AttributeDataType: String
          Name: email
          Required: false

  ItsOnCognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref ItsOnCognitoUserPool
      ClientName: ItsOnUsersClient
      GenerateSecret: false
      ExplicitAuthFlows: # TODO: REMOVE
        - ALLOW_USER_PASSWORD_AUTH # TODO: REMOVE
        - ALLOW_REFRESH_TOKEN_AUTH # TODO: REMOVE

  ItsOnFrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        "Fn::If":
          - IsProdEnv
          - itson.fyi
          - !Sub ${Env}.itson.fyi

  ItsOnCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
          - Id: ItsOnFrontendBucket
            DomainName: !GetAtt ItsOnFrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub "origin-access-identity/cloudfront/${ItsOnCloudFrontOriginAccessIdentity}"
          - Id: ItsOnApi
            DomainName:
              "Fn::If":
                - IsProdEnv
                - https://api.itson.fyi/
                - !Sub "https://${Env}.api.itson.fyi/"
            OriginPath: "/"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: ItsOnFrontendBucket
          ViewerProtocolPolicy: redirect-to-https
          ForwardedValues:
            QueryString: true
        CacheBehaviors:
          - TargetOriginId: ItsOnApi
            PathPattern: "*"
            DefaultTTL: 0
            MinTTL: 0
            MaxTTL: 0
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            ForwardedValues:
              QueryString: true
        Enabled: true
        DefaultRootObject: index.html

  ItsOnCloudFrontOriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: CloudFront access identity

  ItsOnFrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      PolicyDocument:
        Id: ItsOnFrontEndPolicy
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              CanonicalUser: !GetAtt ItsOnCloudFrontOriginAccessIdentity.S3CanonicalUserId
            Action: "s3:GetObject"
            Resource: !Sub
              - "arn:aws:s3:::${Bucket}/*"
              - Bucket: !Ref ItsOnFrontendBucket
          - Effect: Allow
            Principal:
              AWS:
                - !Ref PipelineRole
            Action:
              - "s3:PutObject"
              - "s3:DeleteObject"
            Resource: !Sub
              - "arn:aws:s3:::${Bucket}/*"
              - Bucket: !Ref ItsOnFrontendBucket
      Bucket: !Ref ItsOnFrontendBucket

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL for given env (prod has no subdomain)"
    Value: !Sub "https://${Env}.api.itson.fyi/"
  WebEndpoint:
    Description: "Web endpoint URL for given env (prod has no subdomain)"
    Value: !Sub "https://${Env}.itson.fyi/"
  Website:
    Value: !GetAtt ItsOnCloudFrontDistribution.DomainName
  ItsOnFrontendBucketName:
    Value:
      "Fn::If":
        - IsProdEnv
        - itson.fyi
        - !Sub ${Env}.itson.fyi
