            #   OnFailure:
            #     Type: SQS
            #     Destination: !GetAtt MySqsQueue.Arn
            # TumblingWindowInSeconds: 0
            # FunctionResponseTypes:
            #   - ReportBatchItemFailures
      Handler: handler.handler
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: arn:aws:secretsmanager:us-east-1:992382488292:secret:ItsOnIOSFirebaseServiceAccount-pjnCqi

  tableStreamLambdaFunctionLogGroup:
    Type: 'AWS::Logs::LogGroup'
    Properties:
      RetentionInDays: 30
      LogGroupName: !Join ['', ['/aws/lambda/', !Ref tableStreamLambdaFunction]]

  ItsOnLambdaWarmerRule:
    Type: 'AWS::Events::Rule'
    Properties:
      ScheduleExpression: rate(5 minutes)
      Targets:
        - Arn:
            Fn::GetAtt:
              - getOverviewLambdaFunction
              - Arn
          Id: getOverviewFunction
        - Arn:
            Fn::GetAtt:
              - getChannelLambdaFunction
              - Arn
          Id: getChannelFunction

  PermissionForWarmerRuleToInvokeGetOverviewLambdaFunction:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref getOverviewLambdaFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn:
        Fn::GetAtt:
          - ItsOnLambdaWarmerRule
          - Arn

  PermissionForWarmerRuleToInvokeGetChannelLambdaFunction:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref getChannelLambdaFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn:
        Fn::GetAtt:
          - ItsOnLambdaWarmerRule
          - Arn

  # DynamoDB table to store item: {id: &lt;ID&gt;, name: &lt;NAME&gt;}
  ItsOnTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      DeletionProtectionEnabled:
        'Fn::If':
          - IsProdEnv
          - true
          - false
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      ProvisionedThroughput:
        ReadCapacityUnits: 2
        WriteCapacityUnits: 2
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      Tags:
        - Key: project
          Value: itson
        - Key: env
          Value: !Ref Env

  # Front End Resources
  ItsOnFrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        'Fn::If':
          - IsProdEnv
          - itson.fyi
          - !Sub ${Env}.itson.fyi
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  ItsOnCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        CacheBehaviors:
          - AllowedMethods: [GET, HEAD]
            # Managed CacheDisabled Policy
            # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-cache-policies.html#attaching-managed-cache-policies
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            Compress: true
            PathPattern: index.html
            TargetOriginId: ItsOnFrontendBucket
            ViewerProtocolPolicy: redirect-to-https
          - AllowedMethods: [GET, HEAD]
            # Managed CacheDisabled Policy
            # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-cache-policies.html#attaching-managed-cache-policies
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            Compress: true
            PathPattern: manifest.webmanifest
            TargetOriginId: ItsOnFrontendBucket
            ViewerProtocolPolicy: redirect-to-https
        Comment: Cloudfront Distribution pointing to S3 bucket
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /
        Origins:
          - Id: ItsOnFrontendBucket
            DomainName:
              !Select [2, !Split ['/', !GetAtt ItsOnFrontendBucket.WebsiteURL]]
            CustomOriginConfig:
              HTTPPort: '80'
              HTTPSPort: '443'
              OriginProtocolPolicy: http-only
          - Id: ItsOnApi
            DomainName:
              'Fn::If':
                - IsProdEnv
                - api.itson.fyi
                - !Sub ${Env}.api.itson.fyi
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        Enabled: true
        HttpVersion: 'http2'
        DefaultRootObject: index.html
        Aliases:
          - 'Fn::If':
              - IsProdEnv
              - itson.fyi
              - !Sub ${Env}.itson.fyi
        DefaultCacheBehavior:
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          # Managed CachingOptimized policy
          # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-cache-policies.html#attaching-managed-cache-policies
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          TargetOriginId: ItsOnFrontendBucket
          ViewerProtocolPolicy: redirect-to-https
        PriceClass: PriceClass_All
        ViewerCertificate:
          AcmCertificateArn: arn:aws:acm:us-east-1:992382488292:certificate/197d9b24-eb88-4153-b506-f5816e4868c7
          SslSupportMethod: sni-only

  ItsOnFrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      PolicyDocument:
        Id: ItsOnFrontEndPolicy
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                - !Ref PipelineRole
            Action: '*'
            Resource:
              - !Sub
                - 'arn:aws:s3:::${Bucket}/*'
                - Bucket: !Ref ItsOnFrontendBucket
              - !Sub
                - 'arn:aws:s3:::${Bucket}'
                - Bucket: !Ref ItsOnFrontendBucket
          - Sid: PublicReadForGetBucketObjects
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource:
              - !Sub
                - 'arn:aws:s3:::${Bucket}/*'
                - Bucket: !Ref ItsOnFrontendBucket
      Bucket: !Ref ItsOnFrontendBucket

  # DNS
  ItsOnDNSName:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: Z04756481IJC552VNI712
      RecordSets:
        - Name:
            'Fn::If':
              - IsProdEnv
              - itson.fyi
              - !Sub ${Env}.itson.fyi
          Type: A
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !GetAtt ItsOnCloudFrontDistribution.DomainName

Outputs:
  ApiEndpoint:
    Description: 'API Gateway endpoint URL for given env'
    Value:
      'Fn::If':
        - IsProdEnv
        - https://api.itson.fyi
        - !Sub https://${Env}.api.itson.fyi
  ItsOnFrontendBucketName:
    Value:
      'Fn::If':
        - IsProdEnv
        - itson.fyi
        - !Sub ${Env}.itson.fyi
  WebEndpoint:
    Description: 'Web endpoint URL for given env (prod has no subdomain)'
    Value:
      'Fn::If':
        - IsProdEnv
        - https://itson.fyi
        - !Sub https://${Env}.itson.fyi
  Website:
    Value: !GetAtt ItsOnCloudFrontDistribution.DomainName
