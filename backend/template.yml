# This is the SAM template that represents the architecture of your serverless application
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-template-basics.html

# The AWSTemplateFormatVersion identifies the capabilities of the template
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/format-version-structure.html
AWSTemplateFormatVersion: 2010-09-09
Description: >-
  its-on

# Transform section specifies one or more macros that AWS CloudFormation uses to process your template
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/transform-section-structure.html
Transform:
  - AWS::Serverless-2016-10-31

Parameters:
  Env:
    Type: String
    Default: local
    Description: Environment name - used to populate stack names and subdomains
  PipelineRole:
    Type: String
  PushNotificationPublicKey:
    Type: String
  PushNotificationPrivateKey:
    Type: String

Conditions:
  IsProdEnv: !Equals [!Ref Env, prod]

# Mappings:
# If you're trying to refactor the urls here,
# conditions don't work in the mappings section.
# Just ask Bard.

Globals:
  Function:
    Architectures:
      - arm64
    Environment:
      Variables:
        CLERK_SECRET_KEY_NAME:
          'Fn::If':
            - IsProdEnv
            - ItsOnClerkSecretKey
            - ItsOnClerkDevSecretKey
        CLERK_WEBHOOK_SECRET_NAME:
          'Fn::If':
            - IsProdEnv
            - ItsOnClerkWebhookSecret
            - ItsOnClerkDevWebhookSecret
        FIREBASE_IOS_SERVICE_ACCOUNT_SECRET_NAME: ItsOnIOSFirebaseServiceAccount
        ITS_ON_TABLE: !Ref ItsOnTable
        JWKS_ENDPOINT: https://api.clerk.dev/v1/jwks
        POWERTOOLS_LOG_LEVEL:
          'Fn::If':
            - IsProdEnv
            - INFO
            - DEBUG
        POWERTOOLS_LOGGER_LOG_EVENT:
          'Fn::If':
            - IsProdEnv
            - false
            - true
        POWERTOOLS_LOGGER_SAMPLE_RATE: 0.05
        POWERTOOLS_METRICS_NAMESPACE: its-on
        PUSH_NOTIFICATION_PUBLIC_KEY: !Ref PushNotificationPublicKey
        PUSH_NOTIFICATION_PRIVATE_KEY: !Ref PushNotificationPrivateKey
        STRIPE_API_SECRET_KEY_NAME:
          'Fn::If':
            - IsProdEnv
            - ItsOnStripeApiSecretKey
            - ItsOnStripeApiDevSecretKey
        STRIPE_WEBHOOK_ENDPOINT_SECRET_KEY_NAME:
          'Fn::If':
            - IsProdEnv
            - ItsOnStripeWebhookEndpointSecretKey
            - ItsOnStripeDevWebhookEndpointSecretKey
        WEB_URL:
          'Fn::If':
            - IsProdEnv
            - https://itson.fyi
            - !Sub https://${Env}.itson.fyi
    Layers:
      - !Ref ItsOnNodeModulesLambdaLayer
      - !Ref ItsOnCommonLambdaLayer
    MemorySize: 512
    Runtime: nodejs20.x
    Timeout: 300

# Resources declares the AWS resources that you want to include in the stack
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/resources-section-structure.html
Resources:
  #Backend Resources
  ItsOnApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Env
      Cors:
        AllowCredentials: false
        AllowHeaders: "'Authorization,*'"
        AllowMethods: "'OPTIONS,POST,GET,PUT,DELETE'"
        AllowOrigin: "'*'"
        MaxAge: 600
      Auth:
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          ItsOnLambdaTokenAuthorizer:
            FunctionArn: !GetAtt ItsOnAuthFunction.Arn
        DefaultAuthorizer: ItsOnLambdaTokenAuthorizer
      Domain:
        CertificateArn: arn:aws:acm:us-east-1:992382488292:certificate/197d9b24-eb88-4153-b506-f5816e4868c7
        DomainName:
          'Fn::If':
            - IsProdEnv
            - api.itson.fyi
            - !Sub ${Env}.api.itson.fyi
        Route53:
          EvaluateTargetHealth: true
          HostedZoneId: Z04756481IJC552VNI712
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"

  ItsOnNodeModulesLambdaLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: node-modules
      ContentUri: dist/node-modules-layer/
      CompatibleRuntimes:
        - nodejs20.x
  ItsOnCommonLambdaLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: common
      ContentUri: dist/common-layer/
      CompatibleRuntimes:
        - nodejs20.x

  # Each Lambda function is defined by properties:
  # https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction

  ItsOnAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/src/handlers/
      Handler: authorizer.handler
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn:
              'Fn::If':
                - IsProdEnv
                - arn:aws:secretsmanager:us-east-1:992382488292:secret:ItsOnClerkSecretKey-Fm0hXJ
                - arn:aws:secretsmanager:us-east-1:992382488292:secret:ItsOnClerkDevSecretKey-jZLzk2
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: arn:aws:secretsmanager:us-east-1:992382488292:secret:ItsOnIOSFirebaseServiceAccount-pjnCqi

  # This is a Lambda function config associated with the source code: get-overview.mts
  getOverviewLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/src/handlers/get-overview/
      Description: Gets all of a user's data.
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /
            Method: GET
      Handler: handler.handler
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: arn:aws:secretsmanager:us-east-1:992382488292:secret:ItsOnIOSFirebaseServiceAccount-pjnCqi

  getOverviewLambdaFunctionLogGroup:
    Type: 'AWS::Logs::LogGroup'
    Properties:
      RetentionInDays: 30
      LogGroupName: !Join ['', ['/aws/lambda/', !Ref getOverviewLambdaFunction]]

