# This is the SAM template that represents the architecture of your serverless application
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-template-basics.html

# The AWSTemplateFormatVersion identifies the capabilities of the template
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/format-version-structure.html
AWSTemplateFormatVersion: 2010-09-09
Description: >-
  its-on

# Transform section specifies one or more macros that AWS CloudFormation uses to process your template
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/transform-section-structure.html
Transform:
  - AWS::Serverless-2016-10-31

Parameters:
  Env:
    Type: String
    Default: local
    Description: Environment name - used to populate stack names and subdomains
  PipelineRole:
    Type: String
  SnsCognitoIamExternalId:
    Type: String
  SnsCognitoIamArn:
    Type: String
  SESDomainIdentityArn:
    Type: String
  PushNotificationPublicKey:
    Type: String
  PushNotificationPrivateKey:
    Type: String

Conditions:
  IsProdEnv: !Equals [!Ref Env, prod]

# Mappings:
# If you're trying to refactor the urls here,
# conditions don't work in the mappings section.
# Just ask Bard.

# Resources declares the AWS resources that you want to include in the stack
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/resources-section-structure.html
Resources:
  #Backend Resources
  ItsOnApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Env
      Cors:
        AllowCredentials: false
        AllowHeaders: "'Authorization,*'"
        AllowMethods: "'OPTIONS,POST,GET,PUT,DELETE'"
        AllowOrigin: "'*'"
        MaxAge: 600
      Auth:
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          ItsOnCognitoAuthorizer:
            UserPoolArn: !GetAtt ItsOnUserPool.Arn
        DefaultAuthorizer: ItsOnCognitoAuthorizer
      Domain:
        CertificateArn: arn:aws:acm:us-east-1:303579314896:certificate/89fd3c8f-9ccb-479e-b61a-36987061371e
        DomainName:
          'Fn::If':
            - IsProdEnv
            - api.itson.fyi
            - !Sub ${Env}.api.itson.fyi
        Route53:
          EvaluateTargetHealth: true
          HostedZoneId: Z06575223EAH4XQ5M1AVF
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"

  # Each Lambda function is defined by properties:
  # https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction

  # This is a Lambda function config associated with the source code: get-overview.ts
  getOverviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/get-overview.getOverviewHandler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Gets all of a user's data.
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable
      Environment:
        Variables:
          # Make table name accessible as environment variable from function code during execution
          ITS_ON_TABLE: !Ref ItsOnTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2022'
        Sourcemap: true
        EntryPoints:
          - src/handlers/get-overview.ts
  # Each Lambda function is defined by properties:
  # https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction

  # This is a Lambda function config associated with the source code: get-channel.ts
  getChannelFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/channel/get-channel.getChannelHandler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Gets data related to a channel
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable
      Environment:
        Variables:
          # Make table name accessible as environment variable from function code during execution
          ITS_ON_TABLE: !Ref ItsOnTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /{channelID}
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2022'
        Sourcemap: true
        EntryPoints:
          - src/handlers/channel/get-channel.ts
  # Each Lambda function is defined by properties:
  # https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction

  # This is a Lambda function config associated with the source code: create-item.ts
  createChannelFunction:
