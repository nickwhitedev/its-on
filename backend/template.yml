# This is the SAM template that represents the architecture of your serverless application
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-template-basics.html

# The AWSTemplateFormatVersion identifies the capabilities of the template
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/format-version-structure.html
AWSTemplateFormatVersion: 2010-09-09
Description: >-
  its-on

# Transform section specifies one or more macros that AWS CloudFormation uses to process your template
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/transform-section-structure.html
Transform:
  - AWS::Serverless-2016-10-31

Parameters:
  Env:
    Type: String
    Default: local
    Description: Environment name - used to populate stack names and subdomains
  PipelineRole:
    Type: String
  SnsCognitoIamExternalId:
    Type: String
  SnsCognitoIamArn:
    Type: String
  SESDomainIdentityArn:
    Type: String
  PushNotificationPublicKey:
    Type: String
  PushNotificationPrivateKey:
    Type: String

Conditions:
  IsProdEnv: !Equals [!Ref Env, prod]

# Mappings:
# If you're trying to refactor the urls here,
# conditions don't work in the mappings section.
# Just ask Bard.

Globals:
  Function:
    Architectures:
      - x86_64
    Environment:
      Variables:
        ITS_ON_TABLE: !Ref ItsOnTable
        POWERTOOLS_LOG_LEVEL:
          'Fn::If':
            - IsProdEnv
            - INFO
            - DEBUG
        POWERTOOLS_LOGGER_LOG_EVENT:
          'Fn::If':
            - IsProdEnv
            - false
            - true
        POWERTOOLS_LOGGER_SAMPLE_RATE: 0.05
        POWERTOOLS_METRICS_NAMESPACE: its-on
        PUSH_NOTIFICATION_PUBLIC_KEY: !Ref PushNotificationPublicKey
        PUSH_NOTIFICATION_PRIVATE_KEY: !Ref PushNotificationPrivateKey
        WEB_URL:
          'Fn::If':
            - IsProdEnv
            - https://itson.fyi
            - !Sub https://${Env}.itson.fyi
    Layers:
      - !Ref ItsOnNodeModulesLambdaLayer
      - !Ref ItsOnCommonLambdaLayer
    MemorySize: 128
    Runtime: nodejs20.x
    Timeout: 100

# Resources declares the AWS resources that you want to include in the stack
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/resources-section-structure.html
Resources:
  #Backend Resources
  ItsOnApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Env
      Cors:
        AllowCredentials: false
        AllowHeaders: "'Authorization,*'"
        AllowMethods: "'OPTIONS,POST,GET,PUT,DELETE'"
        AllowOrigin: "'*'"
        MaxAge: 600
      Auth:
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          ItsOnCognitoAuthorizer:
            UserPoolArn: !GetAtt ItsOnUserPool.Arn
        DefaultAuthorizer: ItsOnCognitoAuthorizer
      Domain:
        CertificateArn: arn:aws:acm:us-east-1:303579314896:certificate/89fd3c8f-9ccb-479e-b61a-36987061371e
        DomainName:
          'Fn::If':
            - IsProdEnv
            - api.itson.fyi
            - !Sub ${Env}.api.itson.fyi
        Route53:
          EvaluateTargetHealth: true
          HostedZoneId: Z06575223EAH4XQ5M1AVF
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"

  ItsOnNodeModulesLambdaLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: node-modules
      ContentUri: dist/node-modules-layer/
      CompatibleRuntimes:
        - nodejs20.x
  ItsOnCommonLambdaLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: common
      ContentUri: dist/common-layer/
      CompatibleRuntimes:
        - nodejs20.x

  # Each Lambda function is defined by properties:
  # https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction

  # This is a Lambda function config associated with the source code: get-overview.mts
  getOverviewLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/src/handlers/get-overview/
      Description: Gets all of a user's data.
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /
            Method: GET
      Handler: handler.handler
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable

  getOverviewLambdaFunctionLogGroup:
    Type: 'AWS::Logs::LogGroup'
    DependsOn: 'getOverviewLambdaFunction'
    Properties:
      RetentionInDays: 30
      LogGroupName: !Join ['', ['/aws/lambda/', !Ref getOverviewLambdaFunction]]

  # This is a Lambda function config associated with the source code: get-channel.mts
  getChannelLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/src/handlers/channel/get-channel/
      Description: Gets data related to a channel
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /{channelID}
            Method: GET
      Handler: handler.handler
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable

  getChannelLambdaFunctionLogGroup:
    Type: 'AWS::Logs::LogGroup'
    DependsOn: 'getChannelLambdaFunction'
    Properties:
      RetentionInDays: 30
      LogGroupName: !Join ['', ['/aws/lambda/', !Ref getChannelLambdaFunction]]

  # This is a Lambda function config associated with the source code: create-item.mts
  createChannelLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/src/handlers/channel/create-channel/
      Description: Creates a channel for a user
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /channels
            Method: POST
      Handler: handler.handler
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable

  createChannelLambdaFunctionLogGroup:
    Type: 'AWS::Logs::LogGroup'
    DependsOn: 'createChannelLambdaFunction'
    Properties:
      RetentionInDays: 30
      LogGroupName:
        !Join ['', ['/aws/lambda/', !Ref createChannelLambdaFunction]]

  # This is a Lambda function config associated with the source code: update-item.mts
  updateChannelLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/src/handlers/channel/update-channel/
      Description: Updates a channel for a user
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /{channelID}
            Method: PUT
      Handler: handler.handler
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable

  updateChannelLambdaFunctionLogGroup:
    Type: 'AWS::Logs::LogGroup'
    DependsOn: 'updateChannelLambdaFunction'
    Properties:
      RetentionInDays: 30
      LogGroupName:
        !Join ['', ['/aws/lambda/', !Ref updateChannelLambdaFunction]]

  # This is a Lambda function config associated with the source code: its-on.mts
  itsOnLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/src/handlers/channel/its-on/
      Description: Turns a channel on for a user
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /{channelID}/its-on
            Method: POST
      Handler: handler.handler
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable

  itsOnLambdaFunctionLogGroup:
    Type: 'AWS::Logs::LogGroup'
    DependsOn: 'itsOnLambdaFunction'
    Properties:
      RetentionInDays: 30
      LogGroupName: !Join ['', ['/aws/lambda/', !Ref itsOnLambdaFunction]]

  # This is a Lambda function config associated with the source code: its-off.mts
  itsOffLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/src/handlers/channel/its-off/
      Description: Turns a channel off for a user
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /{channelID}/its-off
            Method: POST
      Handler: handler.handler
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable

  itsOffLambdaFunctionLogGroup:
    Type: 'AWS::Logs::LogGroup'
    DependsOn: 'itsOffLambdaFunction'
    Properties:
      RetentionInDays: 30
      LogGroupName: !Join ['', ['/aws/lambda/', !Ref itsOffLambdaFunction]]

  # This is a Lambda function config associated with the source code: delete-item.mts
  deleteChannelLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/src/handlers/channel/delete-channel/
      Description: Deletes a channel for a user
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /{channelID}
            Method: DELETE
      Handler: handler.handler
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable

  deleteChannelLambdaFunctionLogGroup:
    Type: 'AWS::Logs::LogGroup'
    DependsOn: 'deleteChannelLambdaFunction'
    Properties:
      RetentionInDays: 30
      LogGroupName:
        !Join ['', ['/aws/lambda/', !Ref deleteChannelLambdaFunction]]

  # This is a Lambda function config associated with the source code: delete-item.mts
  removeChannelSubscriberLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/src/handlers/channel/remove-channel-subscriber/
      Description: Removes a channel's subscriber for a user
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /{channelID}/subscribers/{subscriberID}
            Method: DELETE
      Handler: handler.handler
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable

  removeChannelSubscriberLambdaFunctionLogGroup:
    Type: 'AWS::Logs::LogGroup'
    DependsOn: 'removeChannelSubscriberLambdaFunction'
    Properties:
      RetentionInDays: 30
      LogGroupName:
        !Join ['', ['/aws/lambda/', !Ref removeChannelSubscriberLambdaFunction]]

  # This is a Lambda function config associated with the source code: subscribe.mts
  subscribeLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/src/handlers/channel/subscribe/
      Description: Subscribes a user to a channel
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /{channelID}/subscribe
            Method: POST
      Handler: handler.handler
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable

  subscribeLambdaFunctionLogGroup:
    Type: 'AWS::Logs::LogGroup'
    DependsOn: 'subscribeLambdaFunction'
    Properties:
      RetentionInDays: 30
      LogGroupName: !Join ['', ['/aws/lambda/', !Ref subscribeLambdaFunction]]

  # This is a Lambda function config associated with the source code: unsubscribe.mts
  unsubscribeLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/src/handlers/channel/unsubscribe/
      Description: Unsubscribes a user from a channel
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /{channelID}/unsubscribe
            Method: POST
      Handler: handler.handler
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable

  unsubscribeLambdaFunctionLogGroup:
    Type: 'AWS::Logs::LogGroup'
    DependsOn: 'unsubscribeLambdaFunction'
    Properties:
      RetentionInDays: 30
      LogGroupName: !Join ['', ['/aws/lambda/', !Ref unsubscribeLambdaFunction]]

  # This is a Lambda function config associated with the source code: get-notification-key.mts
  getNotificationKeyLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/src/handlers/notifications/get-notification-key/
      Description: Gets the public VAPID key to use for notifications
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /notification-key
            Method: GET
      Handler: handler.handler
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable

  getNotificationKeyLambdaFunctionLogGroup:
    Type: 'AWS::Logs::LogGroup'
    DependsOn: 'getNotificationKeyLambdaFunction'
    Properties:
      RetentionInDays: 30
      LogGroupName:
        !Join ['', ['/aws/lambda/', !Ref getNotificationKeyLambdaFunction]]

  # This is a Lambda function config associated with the source code: enable-notifications.mts
  enableNotificationsLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/src/handlers/notifications/enable-notifications/
      Description: Enables notifications for a user
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /enable-notifications
            Method: POST
      Handler: handler.handler
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable

  enableNotificationsLambdaFunctionLogGroup:
    Type: 'AWS::Logs::LogGroup'
    DependsOn: 'enableNotificationsLambdaFunction'
    Properties:
      RetentionInDays: 30
      LogGroupName:
        !Join ['', ['/aws/lambda/', !Ref enableNotificationsLambdaFunction]]

  # This is a Lambda function config associated with the source code: disable-notifications.mts
  disableNotificationsLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/src/handlers/notifications/disable-notifications/
      Description: Disables notifications for a user
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /disable-notifications
            Method: POST
      Handler: handler.handler
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable

  disableNotificationsLambdaFunctionLogGroup:
    Type: 'AWS::Logs::LogGroup'
    DependsOn: 'disableNotificationsLambdaFunction'
    Properties:
      RetentionInDays: 30
      LogGroupName:
        !Join ['', ['/aws/lambda/', !Ref disableNotificationsLambdaFunction]]

  # This is a Lambda function config associated with the source code: subscribe-notifications.mts
  subscribeNotificationsLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/src/handlers/notifications/subscribe-notifications/
      Description: Register a user's notification subscription
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /subscribe-notifications
            Method: POST
      Handler: handler.handler
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable

  subscribeNotificationsLambdaFunctionLogGroup:
    Type: 'AWS::Logs::LogGroup'
    DependsOn: 'subscribeNotificationsLambdaFunction'
    Properties:
      RetentionInDays: 30
      LogGroupName:
        !Join ['', ['/aws/lambda/', !Ref subscribeNotificationsLambdaFunction]]

  # This is a Lambda function config associated with the source code: unsubscribe-notifications.mts
  unsubscribeNotificationsLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/src/handlers/notifications/unsubscribe-notifications/
      Description: Unregister a user's notification subscription
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /unsubscribe-notifications
            Method: POST
      Handler: handler.handler
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable

  unsubscribeNotificationsLambdaFunctionLogGroup:
    Type: 'AWS::Logs::LogGroup'
    DependsOn: 'unsubscribeNotificationsLambdaFunction'
    Properties:
      RetentionInDays: 30
      LogGroupName:
        !Join [
          '',
          ['/aws/lambda/', !Ref unsubscribeNotificationsLambdaFunction],
        ]

  # This is a Lambda function config associated with the source code: update-profile.mts
  updateProfileLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/src/handlers/user/update-profile/
      Description: Updates a user's profile
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /user
            Method: PUT
      Handler: handler.handler
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable

  updateProfileLambdaFunctionLogGroup:
    Type: 'AWS::Logs::LogGroup'
    DependsOn: 'updateProfileLambdaFunction'
    Properties:
      RetentionInDays: 30
      LogGroupName:
        !Join ['', ['/aws/lambda/', !Ref updateProfileLambdaFunction]]

  # This is a Lambda function config associated with the source code: post-log.mts
  postLogLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/src/handlers/post-log/
      Description: Posts a log sent from the frontend
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /log
            Method: POST
      Handler: handler.handler
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable

  postLogLambdaFunctionLogGroup:
    Type: 'AWS::Logs::LogGroup'
    DependsOn: 'postLogLambdaFunction'
    Properties:
      RetentionInDays: 30
      LogGroupName: !Join ['', ['/aws/lambda/', !Ref postLogLambdaFunction]]

  tableStreamLambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/src/handlers/table-stream/
      Description: Handles write events from the ItsOnTable
      Events:
        TableStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt ItsOnTable.StreamArn
            StartingPosition: LATEST
            # BatchSize: 10
            # MaximumBatchingWindowInSeconds: 10
            # Enabled: true
            # ParallelizationFactor: 1
            # MaximumRetryAttempts: 10
            # BisectBatchOnFunctionError: true
            # MaximumRecordAgeInSeconds: 86400
            # DestinationConfig:
            #   OnFailure:
            #     Type: SQS
            #     Destination: !GetAtt MySqsQueue.Arn
            # TumblingWindowInSeconds: 0
            # FunctionResponseTypes:
            #   - ReportBatchItemFailures
      Handler: handler.handler
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable

  tableStreamLambdaFunctionLogGroup:
    Type: 'AWS::Logs::LogGroup'
    DependsOn: 'tableStreamLambdaFunction'
    Properties:
      RetentionInDays: 30
      LogGroupName: !Join ['', ['/aws/lambda/', !Ref tableStreamLambdaFunction]]

  # DynamoDB table to store item: {id: &lt;ID&gt;, name: &lt;NAME&gt;}
  ItsOnTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      DeletionProtectionEnabled:
        'Fn::If':
          - IsProdEnv
          - true
          - false
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      ProvisionedThroughput:
        ReadCapacityUnits: 2
        WriteCapacityUnits: 2
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      Tags:
        - Key: project
          Value: itson
        - Key: env
          Value: !Ref Env

  # Auth Resources
  ItsOnUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      AdminCreateUserConfig: # Disable this to test sign-up flow in dev environments
        AllowAdminCreateUserOnly:
          'Fn::If':
            - IsProdEnv
            - false
            - true
        InviteMessageTemplate:
          EmailMessage:
            Fn::Join:
              - ''
              - - '<body>'
                - '<h3>You&apos;ve been invited to the Closed Alpha for It&apos;s On!</h3>'
                - '<p>Your username is <strong>{username}</strong> and temporary password is <strong>{####}</strong></p>'
                - '<p>Go to '
                - 'Fn::If':
                    - IsProdEnv
                    - https://itson.fyi
                    - !Sub https://${Env}.itson.fyi
                - ' and log in to get started.</p>'
                - '<p>Once the alpha is over and the app is in beta/fully launched, alpha accounts and the data associated with them will be deleted.</p>'
                - '<p>To use It&apos;s On as an app instead of a website (please do try this), follow these instructions: https://support.google.com/chrome/answer/9658361.</p>'
                - '<p>Anyone can email the username they want and their email address to alpha@itson.fyi to request an invite, so tell your friends!</p>'
                - '<p>Subscribe to the It&apos;s On Alpha channel by nick to get alpha related updates: https://dev.itson.fyi/IDFxN39mg5O</p>'
                - '<p>Feel free to send feedback to feedback@itson.fyi</p>'
                - '<p>Join the It&apos;s On Discord Server here - https://discord.gg/jVtcuu2f5N</p>'
                - '<p>Enjoy!</p>'
                - '</body>'
          EmailSubject: It's On!
      AliasAttributes:
        - email
        - phone_number
        - preferred_username
      AutoVerifiedAttributes:
        - email
        - phone_number
      DeletionProtection:
        'Fn::If':
          - IsProdEnv
          - ACTIVE
          - INACTIVE
      DeviceConfiguration:
        ChallengeRequiredOnNewDevice: true
        DeviceOnlyRememberedOnUserPrompt: false
      EmailConfiguration:
        # ConfigurationSet: Used for event monitoring and ip management
        EmailSendingAccount: DEVELOPER
        From: It's On <no-reply@itson.fyi>
        SourceArn: !Ref SESDomainIdentityArn
      EnabledMfas:
        - SMS_MFA
        - SOFTWARE_TOKEN_MFA
      MfaConfiguration: OPTIONAL
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: true
      Schema:
        - AttributeDataType: String
          Mutable: true
          Name: email
          Required: true
        - AttributeDataType: String
          Mutable: true
          Name: phone_number
          Required: false # TODO: UserPool: phone number based sign-up?
        - AttributeDataType: String
          Mutable: true
          Name: preferred_username
          Required: true
      SmsConfiguration:
        ExternalId: !Ref SnsCognitoIamExternalId
        SnsCallerArn: !Ref SnsCognitoIamArn
        SnsRegion: us-east-1
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - phone_number
          - email
      UsernameConfiguration:
        CaseSensitive: false
      # TODO: UserPool: Delete if not needed
      # UsernameAttributes:
      #   - phone_number
      #   - email
      # TODO: UserPool: Enable on Launch
      # UserPoolAddOns:
      #   AdvancedSecurityMode:
      #     "Fn::If":
      #       - IsProdEnv
      #       - AUDIT # Audit for a couple of weeks then switch to ENFORCE
      #       - OFF
      UserPoolName: !Sub ItsOnUsers-${Env}

  ItsOnUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - email
        - phone
        - profile
        - openid
      CallbackURLs:
        - 'Fn::If':
            - IsProdEnv
            - https://itson.fyi/
            - !Sub https://${Env}.itson.fyi/
        - 'Fn::If':
            - IsProdEnv
            - !Ref AWS::NoValue
            - http://localhost:5173/
      ClientName: !Sub ItsOnUsersClient-${Env}
      DefaultRedirectURI:
        'Fn::If':
          - IsProdEnv
          - https://itson.fyi/
          - !Sub https://${Env}.itson.fyi/
      GenerateSecret: false
      LogoutURLs:
        - 'Fn::If':
            - IsProdEnv
            - https://itson.fyi/
            - !Sub https://${Env}.itson.fyi/
        - 'Fn::If':
            - IsProdEnv
            - !Ref AWS::NoValue
            - http://localhost:5173/
      RefreshTokenValidity: 365
      SupportedIdentityProviders:
        - COGNITO
      UserPoolId: !Ref ItsOnUserPool

  ItsOnUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      CustomDomainConfig:
        CertificateArn: arn:aws:acm:us-east-1:303579314896:certificate/89fd3c8f-9ccb-479e-b61a-36987061371e
      Domain:
        'Fn::If':
          - IsProdEnv
          - auth.itson.fyi
          - !Sub ${Env}-auth.itson.fyi
      UserPoolId: !Ref ItsOnUserPool

  # Front End Resources
  ItsOnFrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        'Fn::If':
          - IsProdEnv
          - itson.fyi
          - !Sub ${Env}.itson.fyi
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  ItsOnCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        CacheBehaviors:
          - AllowedMethods: [GET, HEAD]
            # Managed CacheDisabled Policy
            # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-cache-policies.html#attaching-managed-cache-policies
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            Compress: true
            PathPattern: index.html
            TargetOriginId: ItsOnFrontendBucket
            ViewerProtocolPolicy: redirect-to-https
        Comment: Cloudfront Distribution pointing to S3 bucket
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /
        Origins:
          - Id: ItsOnFrontendBucket
            DomainName:
              !Select [2, !Split ['/', !GetAtt ItsOnFrontendBucket.WebsiteURL]]
            CustomOriginConfig:
              HTTPPort: '80'
              HTTPSPort: '443'
              OriginProtocolPolicy: http-only
          - Id: ItsOnApi
            DomainName:
              'Fn::If':
                - IsProdEnv
                - api.itson.fyi
                - !Sub ${Env}.api.itson.fyi
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        Enabled: true
        HttpVersion: 'http2'
        DefaultRootObject: index.html
        Aliases:
          - 'Fn::If':
              - IsProdEnv
              - itson.fyi
              - !Sub ${Env}.itson.fyi
        DefaultCacheBehavior:
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          # Managed CachingOptimized policy
          # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-cache-policies.html#attaching-managed-cache-policies
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          TargetOriginId: ItsOnFrontendBucket
          ViewerProtocolPolicy: redirect-to-https
        PriceClass: PriceClass_All
        ViewerCertificate:
          AcmCertificateArn: arn:aws:acm:us-east-1:303579314896:certificate/89fd3c8f-9ccb-479e-b61a-36987061371e
          SslSupportMethod: sni-only

  ItsOnFrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      PolicyDocument:
        Id: ItsOnFrontEndPolicy
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                - !Ref PipelineRole
            Action: '*'
            Resource:
              - !Sub
                - 'arn:aws:s3:::${Bucket}/*'
                - Bucket: !Ref ItsOnFrontendBucket
              - !Sub
                - 'arn:aws:s3:::${Bucket}'
                - Bucket: !Ref ItsOnFrontendBucket
          - Sid: PublicReadForGetBucketObjects
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource:
              - !Sub
                - 'arn:aws:s3:::${Bucket}/*'
                - Bucket: !Ref ItsOnFrontendBucket
      Bucket: !Ref ItsOnFrontendBucket

  # DNS
  ItsOnDNSName:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: Z06575223EAH4XQ5M1AVF
      RecordSets:
        - Name:
            'Fn::If':
              - IsProdEnv
              - itson.fyi
              - !Sub ${Env}.itson.fyi
          Type: A
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !GetAtt ItsOnCloudFrontDistribution.DomainName
        - Name:
            'Fn::If':
              - IsProdEnv
              - auth.itson.fyi
              - !Sub ${Env}-auth.itson.fyi
          ResourceRecords:
            - !GetAtt ItsOnUserPoolDomain.CloudFrontDistribution
          TTL: 60
          Type: CNAME

Outputs:
  ApiEndpoint:
    Description: 'API Gateway endpoint URL for given env'
    Value:
      'Fn::If':
        - IsProdEnv
        - https://api.itson.fyi
        - !Sub https://${Env}.api.itson.fyi
  AuthEndpoint:
    Description: 'Cognito Hosted UI endpoint URL for given env'
    Value:
      'Fn::If':
        - IsProdEnv
        - https://auth.itson.fyi
        - !Sub https://${Env}-auth.itson.fyi
  CognitoClientID:
    Value: !Ref ItsOnUserPoolClient
  CognitoUserPoolID:
    Value: !Ref ItsOnUserPool
  ItsOnFrontendBucketName:
    Value:
      'Fn::If':
        - IsProdEnv
        - itson.fyi
        - !Sub ${Env}.itson.fyi
  WebEndpoint:
    Description: 'Web endpoint URL for given env (prod has no subdomain)'
    Value:
      'Fn::If':
        - IsProdEnv
        - https://itson.fyi
        - !Sub https://${Env}.itson.fyi
  Website:
    Value: !GetAtt ItsOnCloudFrontDistribution.DomainName
