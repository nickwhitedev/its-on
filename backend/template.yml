    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2022'
        Sourcemap: true
        EntryPoints:
          - src/handlers/channel/update-channel.ts

  # This is a Lambda function config associated with the source code: its-on.ts
  itsOnFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/channel/its-on.itsOnHandler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
