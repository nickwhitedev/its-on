  # This is a Lambda function config associated with the source code: delete-item.ts
  deleteChannelFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/channel/delete-channel.deleteChannelHandler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Deletes a channel for a user
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable
      Environment:
        Variables:
          # Make table name accessible as environment variable from function code during execution
          ITS_ON_TABLE: !Ref ItsOnTable
      Events:
        Api:
          Type: Api
          Properties:
