    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2022'
        Sourcemap: true
        EntryPoints:
          - src/handlers/channel/delete-channel.ts

  # This is a Lambda function config associated with the source code: delete-item.ts
  removeChannelSubscriberFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/channel/remove-channel-subscriber.removeChannelSubscriberHandler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Removes a channel's subscriber for a user
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable
      Environment:
        Variables:
          # Make table name accessible as environment variable from function code during execution
          ITS_ON_TABLE: !Ref ItsOnTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /{channelID}/subscribers/{subscriberID}
            Method: DELETE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2022'
        Sourcemap: true
        EntryPoints:
          - src/handlers/channel/remove-channel-subscriber.ts

  # This is a Lambda function config associated with the source code: subscribe.ts
  subscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/channel/subscribe.subscribeHandler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Subscribes a user to a channel
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable
      Environment:
        Variables:
          # Make table name accessible as environment variable from function code during execution
          ITS_ON_TABLE: !Ref ItsOnTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /{channelID}/subscribe
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2022'
        Sourcemap: true
        EntryPoints:
          - src/handlers/channel/subscribe.ts

  # This is a Lambda function config associated with the source code: unsubscribe.ts
  unsubscribeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/channel/unsubscribe.unsubscribeHandler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Unsubscribes a user from a channel
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable
      Environment:
        Variables:
          # Make table name accessible as environment variable from function code during execution
          ITS_ON_TABLE: !Ref ItsOnTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /{channelID}/unsubscribe
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2022'
        Sourcemap: true
        EntryPoints:
          - src/handlers/channel/unsubscribe.ts

  # This is a Lambda function config associated with the source code: get-notification-key.ts
  getNotificationKeyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/notifications/get-notification-key.getNotificationKeyHandler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Gets the public VAPID key to use for notifications
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable
      Environment:
        Variables:
          PUSH_NOTIFICATION_PUBLIC_KEY: !Ref PushNotificationPublicKey
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /notification-key
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2022'
        Sourcemap: true
        EntryPoints:
          - src/handlers/notifications/get-notification-key.ts

  # This is a Lambda function config associated with the source code: enable-notifications.ts
  enableNotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/notifications/enable-notifications.enableNotificationsHandler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Enables notifications for a user
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable
      Environment:
        Variables:
          # Make table name accessible as environment variable from function code during execution
          ITS_ON_TABLE: !Ref ItsOnTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /enable-notifications
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2022'
        Sourcemap: true
        EntryPoints:
          - src/handlers/notifications/enable-notifications.ts

  # This is a Lambda function config associated with the source code: disable-notifications.ts
  disableNotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/notifications/disable-notifications.disableNotificationsHandler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Disables notifications for a user
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable
      Environment:
        Variables:
          # Make table name accessible as environment variable from function code during execution
          ITS_ON_TABLE: !Ref ItsOnTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /disable-notifications
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2022'
        Sourcemap: true
        EntryPoints:
          - src/handlers/notifications/disable-notifications.ts

  # This is a Lambda function config associated with the source code: subscribe-notifications.ts
  subscribeNotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/notifications/subscribe-notifications.subscribeNotificationsHandler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Register a user's notification subscription
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable
      Environment:
        Variables:
          # Make table name accessible as environment variable from function code during execution
          ITS_ON_TABLE: !Ref ItsOnTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /subscribe-notifications
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2022'
        Sourcemap: true
        EntryPoints:
          - src/handlers/notifications/subscribe-notifications.ts

  # This is a Lambda function config associated with the source code: unsubscribe-notifications.ts
  unsubscribeNotificationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/notifications/unsubscribe-notifications.unsubscribeNotificationsHandler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Unregister a user's notification subscription
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable
      Environment:
        Variables:
          # Make table name accessible as environment variable from function code during execution
          ITS_ON_TABLE: !Ref ItsOnTable
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref ItsOnApi
            Path: /unsubscribe-notifications
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2022'
        Sourcemap: true
        EntryPoints:
          - src/handlers/notifications/unsubscribe-notifications.ts

  tableStreamFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/table-stream.tableStreamHandler
      Runtime: nodejs18.x
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 100
      Description: Handles write events from the ItsOnTable
      Policies:
        # Give Create/Read/Update/Delete Permissions to the ItsOnTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ItsOnTable
      Environment:
        Variables:
          # Make table name accessible as environment variable from function code during execution
          ITS_ON_TABLE: !Ref ItsOnTable
          PUSH_NOTIFICATION_PUBLIC_KEY: !Ref PushNotificationPublicKey
          PUSH_NOTIFICATION_PRIVATE_KEY: !Ref PushNotificationPrivateKey
          WEB_URL:
            'Fn::If':
              - IsProdEnv
              - https://itson.fyi
              - !Sub https://${Env}.itson.fyi
      Events:
        TableStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt ItsOnTable.StreamArn
            StartingPosition: LATEST
            # BatchSize: 10
            # MaximumBatchingWindowInSeconds: 10
            # Enabled: true
            # ParallelizationFactor: 1
            # MaximumRetryAttempts: 10
            # BisectBatchOnFunctionError: true
            # MaximumRecordAgeInSeconds: 86400
            # DestinationConfig:
            #   OnFailure:
            #     Type: SQS
            #     Destination: !GetAtt MySqsQueue.Arn
            # TumblingWindowInSeconds: 0
            # FunctionResponseTypes:
            #   - ReportBatchItemFailures
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: 'es2022'
        Sourcemap: true
        EntryPoints:
          - src/handlers/table-stream.ts

  # DynamoDB table to store item: {id: &lt;ID&gt;, name: &lt;NAME&gt;}
  ItsOnTable:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      DeletionProtectionEnabled:
        'Fn::If':
          - IsProdEnv
          - true
          - false
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      ProvisionedThroughput:
        ReadCapacityUnits: 2
        WriteCapacityUnits: 2
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      Tags:
        - Key: project
          Value: itson
        - Key: env
          Value: !Ref Env

  # Auth Resources
  ItsOnUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      AdminCreateUserConfig: # Disable this to test signup flow in dev environments
        AllowAdminCreateUserOnly:
          'Fn::If':
            - IsProdEnv
            - false
            - true
        InviteMessageTemplate:
          EmailMessage:
            Fn::Join:
              - ''
              -
                - '<body>'
                - '<h3>You&apos;ve been invited to use It&apos;s On!</h3>'
                - '<p>Your username is <strong>{username}</strong> and temporary password is <strong>{####}</strong></p>'
                - '<p>Go to '
                - 'Fn::If':
                    - IsProdEnv
                    - https://itson.fyi
                    - !Sub https://${Env}.itson.fyi
                - ' and log in to get started.</p>'
                - '<p>To use It&apos;s On as an app instead of a website (please do try this), follow these instructions: https://support.google.com/chrome/answer/9658361.</p>'
                - '<p>Feel free to send feedback to feedback@itson.fyi</p>'
                - '<p>Join the It&apos;s On Discord Server here - https://discord.gg/jVtcuu2f5N</p>'
                - '<p>Enjoy!</p>'
                - '</body>'
          EmailSubject: It's On!
      AliasAttributes:
        - email
        - phone_number
        - preferred_username
      AutoVerifiedAttributes:
        - email
        - phone_number
      DeletionProtection:
        'Fn::If':
          - IsProdEnv
          - ACTIVE
          - INACTIVE
      DeviceConfiguration:
        ChallengeRequiredOnNewDevice: true
        DeviceOnlyRememberedOnUserPrompt: false
      EmailConfiguration:
        # ConfigurationSet: Used for event monitoring and ip management
        EmailSendingAccount: DEVELOPER
        From: It's On <no-reply@itson.fyi>
        SourceArn: !Ref SESDomainIdentityArn
      EnabledMfas:
        - SMS_MFA
        - SOFTWARE_TOKEN_MFA
      MfaConfiguration: OPTIONAL
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: true
      Schema:
        - AttributeDataType: String
          Name: email
          Required: true
        - AttributeDataType: String
          Name: name
          Required: false
        - AttributeDataType: String
          Name: phone_number
          Required: false # TODO: UserPool: phone number based sign-up?
        - AttributeDataType: String
          Name: preferred_username
          Required: false
      SmsConfiguration:
        ExternalId: !Ref SnsCognitoIamExternalId
        SnsCallerArn: !Ref SnsCognitoIamArn
        SnsRegion: us-east-1
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - phone_number
          - email
      UsernameConfiguration:
        CaseSensitive: false
      # TODO: UserPool: Delete if not needed
      # UsernameAttributes:
      #   - phone_number
      #   - email
      # TODO: UserPool: Enable on Launch
      # UserPoolAddOns:
      #   AdvancedSecurityMode:
      #     "Fn::If":
      #       - IsProdEnv
      #       - AUDIT # Audit for a couple of weeks then switch to ENFORCE
      #       - OFF
      UserPoolName: !Sub ItsOnUsers-${Env}

  ItsOnUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      AllowedOAuthFlows:
        - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
        - email
        - phone
        - profile
        - openid
      CallbackURLs:
        - 'Fn::If':
            - IsProdEnv
            - https://itson.fyi/
            - !Sub https://${Env}.itson.fyi/
        - 'Fn::If':
            - IsProdEnv
            - !Ref AWS::NoValue
            - http://localhost:5173/
      ClientName: !Sub ItsOnUsersClient-${Env}
      DefaultRedirectURI:
        'Fn::If':
          - IsProdEnv
          - https://itson.fyi/
          - !Sub https://${Env}.itson.fyi/
      GenerateSecret: false
      LogoutURLs:
        - 'Fn::If':
            - IsProdEnv
            - https://itson.fyi/
            - !Sub https://${Env}.itson.fyi/
        - 'Fn::If':
            - IsProdEnv
            - !Ref AWS::NoValue
            - http://localhost:5173/
      RefreshTokenValidity: 365
      SupportedIdentityProviders:
        - COGNITO
      UserPoolId: !Ref ItsOnUserPool

  ItsOnUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      CustomDomainConfig:
        CertificateArn: arn:aws:acm:us-east-1:303579314896:certificate/89fd3c8f-9ccb-479e-b61a-36987061371e
      Domain:
        'Fn::If':
          - IsProdEnv
          - auth.itson.fyi
          - !Sub ${Env}-auth.itson.fyi
      UserPoolId: !Ref ItsOnUserPool

  # Front End Resources
  ItsOnFrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        'Fn::If':
          - IsProdEnv
          - itson.fyi
          - !Sub ${Env}.itson.fyi
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: ObjectWriter
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

  ItsOnCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        CacheBehaviors:
          - AllowedMethods: [GET, HEAD]
            # Managed CacheDisabled Policy
            # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-cache-policies.html#attaching-managed-cache-policies
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            Compress: true
            PathPattern: index.html
            TargetOriginId: ItsOnFrontendBucket
            ViewerProtocolPolicy: redirect-to-https
        Comment: Cloudfront Distribution pointing to S3 bucket
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /
        Origins:
          - Id: ItsOnFrontendBucket
            DomainName:
              !Select [2, !Split ['/', !GetAtt ItsOnFrontendBucket.WebsiteURL]]
            CustomOriginConfig:
              HTTPPort: '80'
              HTTPSPort: '443'
              OriginProtocolPolicy: http-only
          - Id: ItsOnApi
            DomainName:
              'Fn::If':
                - IsProdEnv
                - api.itson.fyi
                - !Sub ${Env}.api.itson.fyi
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        Enabled: true
        HttpVersion: 'http2'
        DefaultRootObject: index.html
        Aliases:
          - 'Fn::If':
              - IsProdEnv
              - itson.fyi
              - !Sub ${Env}.itson.fyi
        DefaultCacheBehavior:
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          # Managed CachingOptimized policy
          # https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/using-managed-cache-policies.html#attaching-managed-cache-policies
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          TargetOriginId: ItsOnFrontendBucket
          ViewerProtocolPolicy: redirect-to-https
        PriceClass: PriceClass_All
        ViewerCertificate:
          AcmCertificateArn: arn:aws:acm:us-east-1:303579314896:certificate/89fd3c8f-9ccb-479e-b61a-36987061371e
          SslSupportMethod: sni-only

  ItsOnFrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      PolicyDocument:
        Id: ItsOnFrontEndPolicy
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                - !Ref PipelineRole
            Action: '*'
            Resource:
              - !Sub
                - 'arn:aws:s3:::${Bucket}/*'
                - Bucket: !Ref ItsOnFrontendBucket
              - !Sub
                - 'arn:aws:s3:::${Bucket}'
                - Bucket: !Ref ItsOnFrontendBucket
          - Sid: PublicReadForGetBucketObjects
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource:
              - !Sub
                - 'arn:aws:s3:::${Bucket}/*'
                - Bucket: !Ref ItsOnFrontendBucket
      Bucket: !Ref ItsOnFrontendBucket

  # DNS
  ItsOnDNSName:
    Type: AWS::Route53::RecordSetGroup
    Properties:
      HostedZoneId: Z06575223EAH4XQ5M1AVF
      RecordSets:
        - Name:
            'Fn::If':
              - IsProdEnv
              - itson.fyi
              - !Sub ${Env}.itson.fyi
          Type: A
          AliasTarget:
            HostedZoneId: Z2FDTNDATAQYW2
            DNSName: !GetAtt ItsOnCloudFrontDistribution.DomainName
        - Name:
            'Fn::If':
              - IsProdEnv
              - auth.itson.fyi
              - !Sub ${Env}-auth.itson.fyi
          ResourceRecords:
            - !GetAtt ItsOnUserPoolDomain.CloudFrontDistribution
          TTL: 60
          Type: CNAME

Outputs:
  ApiEndpoint:
    Description: 'API Gateway endpoint URL for given env'
    Value:
      'Fn::If':
        - IsProdEnv
        - https://api.itson.fyi
        - !Sub https://${Env}.api.itson.fyi
  AuthEndpoint:
    Description: 'Cognito Hosted UI endpoint URL for given env'
    Value:
      'Fn::If':
        - IsProdEnv
        - https://auth.itson.fyi
        - !Sub https://${Env}-auth.itson.fyi
  CognitoClientID:
    Value: !Ref ItsOnUserPoolClient
  ItsOnFrontendBucketName:
    Value:
      'Fn::If':
        - IsProdEnv
        - itson.fyi
        - !Sub ${Env}.itson.fyi
  WebEndpoint:
    Description: 'Web endpoint URL for given env (prod has no subdomain)'
    Value:
      'Fn::If':
        - IsProdEnv
        - https://itson.fyi
        - !Sub https://${Env}.itson.fyi
  Website:
    Value: !GetAtt ItsOnCloudFrontDistribution.DomainName
