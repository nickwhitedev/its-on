  # This is a Lambda function config associated with the source code: its-off.ts
  itsOffFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: src/handlers/channel/its-off.itsOffHandler
      Runtime: nodejs18.x
      Architectures:
